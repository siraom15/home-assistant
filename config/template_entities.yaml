# ============================================================
# LIGHTS
# ============================================================

- light:

    # --------------------------------------------------------
    # Living Room
    # --------------------------------------------------------

    - name: "Living Room Ceiling"
      unique_id: virtual_living_room_ceiling
      state: "{{ is_state('input_boolean.living_room_ceiling', 'on') }}"
      level: >
        {{ (states('input_number.living_room_ceiling_brightness') | float(100) * 2.55) | int }}

      turn_on:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.living_room_ceiling

      turn_off:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.living_room_ceiling

      set_level:
        - action: input_number.set_value
          target:
            entity_id: input_number.living_room_ceiling_brightness
          data:
            value: "{{ (brightness / 2.55) | round(0) }}"

        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.living_room_ceiling


