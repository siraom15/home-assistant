# ============================================================
# SENSORS
# ============================================================

- sensor:

    - name: "Living Room Temperature"
      unique_id: virtual_living_room_temperature
      state: >
        {{ states('input_number.living_room_temperature_sim') | float(0) }}
      device_class: temperature
      state_class: measurement
      unit_of_measurement: "°C"

    - name: "Living Room Illuminance"
      unique_id: virtual_living_room_illuminance
      state: >
        {{ states('input_number.living_room_illuminance_sim') | float(0) }}
      device_class: illuminance
      state_class: measurement
      unit_of_measurement: "lx"


